<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="memorybank - drift-checked memory records for AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0E16"/>
      <stop offset="1" stop-color="#0E1320"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.1" r="0.9">
      <stop stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="0.9" r="0.8">
      <stop stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="20" fill="url(#glow)"/>
  <rect width="1200" height="380" rx="20" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="378" rx="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <!-- kicker -->
  <text x="80" y="92" font-family="'SF Mono','JetBrains Mono',ui-monospace,monospace" font-size="15" letter-spacing="3.5" fill="#7D8590">091 SOLUTIONS&#160;&#160;/&#160;&#160;CLAUDE CODE PLUGIN</text>

  <!-- wordmark -->
  <text x="78" y="190" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="-2">
    <tspan fill="#E6EDF3">memory</tspan><tspan fill="url(#accent)">bank</tspan>
  </text>

  <!-- tagline -->
  <text x="80" y="230" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#ADBAC7">Drift-checked memory for AI agents.</text>
  <text x="80" y="259" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#7D8590">Memory and code can only move together.</text>

  <!-- kind chips -->
  <g font-family="'SF Mono','JetBrains Mono',ui-monospace,monospace" font-size="14" fill="#C9D1D9">
    <g transform="translate(80,306)">
      <rect width="118" height="34" rx="8" fill="#161B26" stroke="#262E3D"/>
      <circle cx="20" cy="17" r="4" fill="#818CF8"/><text x="34" y="22">decision</text>
    </g>
    <g transform="translate(210,306)">
      <rect width="138" height="34" rx="8" fill="#161B26" stroke="#262E3D"/>
      <circle cx="20" cy="17" r="4" fill="#22D3EE"/><text x="34" y="22">convention</text>
    </g>
    <g transform="translate(360,306)">
      <rect width="80" height="34" rx="8" fill="#161B26" stroke="#262E3D"/>
      <circle cx="20" cy="17" r="4" fill="#3FB950"/><text x="34" y="22">fact</text>
    </g>
    <g transform="translate(452,306)">
      <rect width="104" height="34" rx="8" fill="#161B26" stroke="#262E3D"/>
      <circle cx="20" cy="17" r="4" fill="#D29922"/><text x="34" y="22">feature</text>
    </g>
    <g transform="translate(568,306)">
      <rect width="110" height="34" rx="8" fill="#161B26" stroke="#262E3D"/>
      <circle cx="20" cy="17" r="4" fill="#F778BA"/><text x="34" y="22">deferred</text>
    </g>
  </g>

  <!-- record card mockup -->
  <g transform="translate(792,84)">
    <rect x="0" y="0" width="332" height="212" rx="14" fill="#0D1117" stroke="#262E3D"/>
    <rect x="0" y="0" width="332" height="44" rx="14" fill="#11161F"/>
    <rect x="0" y="30" width="332" height="14" fill="#11161F"/>
    <circle cx="22" cy="22" r="5" fill="#3FB950"/>
    <text x="40" y="27" font-family="'SF Mono','JetBrains Mono',ui-monospace,monospace" font-size="14" fill="#C9D1D9">FACT-001-color-count.md</text>
    <g font-family="'SF Mono','JetBrains Mono',ui-monospace,monospace" font-size="14">
      <text x="22" y="78"><tspan fill="#7D8590">kind:</tspan><tspan fill="#79C0FF">&#160;fact</tspan></text>
      <text x="22" y="104"><tspan fill="#7D8590">rule:</tspan><tspan fill="#ADBAC7">&#160;Color has 3 members</tspan></text>
      <text x="22" y="130"><tspan fill="#7D8590">assert:</tspan><tspan fill="#D2A8FF">&#160;count == 3</tspan></text>
      <text x="22" y="156"><tspan fill="#7D8590">anchor:</tspan><tspan fill="#ADBAC7">&#160;src/sample.ts</tspan></text>
    </g>
    <g transform="translate(22,172)">
      <rect width="92" height="26" rx="13" fill="#10301C" stroke="#238636"/>
      <path d="M14 13l4 4 8-8" fill="none" stroke="#3FB950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="34" y="18" font-family="'SF Mono','JetBrains Mono',ui-monospace,monospace" font-size="13" fill="#3FB950">PASS</text>
    </g>
    <text x="232" y="190" font-family="'SF Mono','JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#586069">CI gated</text>
  </g>
